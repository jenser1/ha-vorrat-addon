{% extends "base.html" %}
{% block title %}Neues Produkt{% endblock %}
{% block page_title %}Neues Produkt{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
  <div class="card-header">
    <span class="card-title">➕ Neues Produkt hinzufügen</span>
  </div>

  <!-- Nur zum Anlegen – bearbeitet wird auf der Produktseite (Klick auf den Namen) -->
  <form method="post">
    {% include "_produkt_felder.html" %}

    <div style="display: flex; gap: 12px; margin-top: 24px;">
      <button type="submit" class="btn btn-primary">✅ Hinzufügen</button>
      <a href="{{ zurueck_url }}" class="btn btn-ghost">Abbrechen</a>
    </div>
  </form>
</div>
{% endblock %}
